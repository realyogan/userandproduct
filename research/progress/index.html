<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Run progress</title>
<style>
:root {
	--paper: #f6f3ea; --paper-2: #efeadb; --card: #fdfcf8; --ink: #1d1b16; --muted: #5f5b52; --rule: #cfc9ba;
	--accent: #f26b2b; --done: #3f8f5b; --highlight: #ffe36e;
	--ok-bg: #dcefd8; --bad: #b3261e; --bad-bg: #fbe0e6; --run-bg: #fff3c4; --skip-bg: #e0e6ee;
	--grid: rgba(50, 80, 130, .07); --shadow: #1d1b16;
	--border: 1.5px solid var(--ink); --stamp: 3px 3px 0 var(--shadow); --radius: 6px;
	--font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	--font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
	:root {
		--paper: #1a1916; --paper-2: #26241f; --card: #211f1b; --ink: #ece6d6; --muted: #a9a293; --rule: #3d3a33;
		--accent: #ff8a4c; --done: #5fbf80; --highlight: #6b5a12;
		--ok-bg: #1f3a28; --bad: #ff7b72; --bad-bg: #4a1f22; --run-bg: #4a3f12; --skip-bg: #2e343c;
		--grid: rgba(160, 180, 220, .05); --shadow: #000;
	}
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0; padding: 1.25rem 1rem 3rem; font: 15px/1.45 var(--font-body); color: var(--ink);
	background-color: var(--paper);
	background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
	background-size: 28px 28px;
}
.wrap { max-width: 56rem; margin: 0 auto; display: grid; gap: 1.25rem; }
.mono { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
h1 { margin: .15rem 0 .5rem; font-size: clamp(1.45rem, 4vw, 2.1rem); line-height: 1.1; font-weight: 800; letter-spacing: -.015em; overflow-wrap: anywhere; }
h2 { margin: 0 0 .75rem; font: 700 .72rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
.box { background: var(--card); border: var(--border); border-radius: var(--radius); box-shadow: var(--stamp); padding: 1rem 1.15rem; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .6rem; border: var(--border); border-radius: 999px; font: 700 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .05em; background: var(--paper-2); color: var(--ink); }
.pill.running { background: var(--run-bg); }
.pill.running::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .pill.running::before { animation: blink 1.4s ease-in-out infinite; } }
@keyframes blink { 50% { opacity: .25; } }
.pill.finished { background: var(--ok-bg); }
.pill.failed, .pill.offline { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn { font: 700 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: .22rem .7rem; border: var(--border); border-radius: 999px; background: var(--highlight); color: var(--ink); cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
.btn:active { box-shadow: none; transform: translate(2px, 2px); }
.alarm { display: inline-flex; align-items: center; gap: .4rem; font: 700 .72rem var(--font-mono); letter-spacing: .03em; padding: .22rem .7rem; border: 1.5px solid var(--rule); border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; max-width: 100%; }
.alarm svg { flex: none; width: 1rem; height: 1rem; }
.alarm[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--done); color: var(--done); box-shadow: 2px 2px 0 var(--shadow); }
.alarm .ic-on { display: none; }
.alarm[aria-pressed="true"] .ic-on { display: block; }
.alarm[aria-pressed="true"] .ic-off { display: none; }
.test { font: 600 .7rem var(--font-mono); color: var(--muted); background: none; border: 0; padding: .1rem .2rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.test:hover { color: var(--ink); }
.note { margin: .6rem 0 0; color: var(--muted); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; margin-top: .8rem; }
.meta b { display: block; font: 700 1rem/1.25 var(--font-mono); font-variant-numeric: tabular-nums; }
.overall { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1rem; align-items: center; }
.bar { height: 20px; background: var(--paper-2); border: var(--border); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.bar.complete i { background: var(--done); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .5s ease; } }
.count { font: 700 1.05rem var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count small { color: var(--muted); font-weight: 400; font-size: .82rem; }
ol.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: .15rem .8rem; align-items: start; padding: .65rem .5rem .65rem 0; border-bottom: 1px dashed var(--rule); }
.step:last-child { border-bottom: 0; }
.step .n { font: 700 .95rem/1.5 var(--font-mono); color: var(--muted); text-align: right; }
.step .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.step .sn { margin: .15rem 0 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.step .side { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
.step .time { font: 600 .78rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.step.running { background: linear-gradient(90deg, var(--run-bg), transparent 85%); border-radius: var(--radius); box-shadow: inset 4px 0 0 var(--accent); }
.step.running .n { color: var(--ink); }
.step.done .t { color: var(--muted); }
.step.skipped .t { text-decoration: line-through; color: var(--muted); }
.step.failed .sn { color: var(--bad); }
.chip { display: inline-block; padding: .08rem .45rem; border: 1px solid var(--ink); border-radius: 999px; font: 600 .66rem var(--font-mono); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; background: var(--paper-2); }
.chip.done { background: var(--ok-bg); }
.chip.running { background: var(--run-bg); }
.chip.failed { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.chip.skipped { background: var(--skip-bg); }
.chip.pending { color: var(--muted); border-color: var(--rule); background: transparent; }
.empty { color: var(--muted); margin: .4rem 0; }
.banner { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; padding: .8rem 1.1rem; background: var(--highlight); border: var(--border); border-radius: var(--radius); box-shadow: var(--stamp); }
.banner.failed { background: var(--bad-bg); border-color: var(--bad); }
.banner div { flex: 1 1 12rem; min-width: 0; }
.banner b { font-size: 1.2rem; font-weight: 800; }
.banner p { margin: .1rem 0 0; }
.banner .btn { background: var(--card); }
@media (max-width: 560px) {
	.step { grid-template-columns: 1.6rem minmax(0, 1fr); }
	.step .side { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; }
}
</style>
</head>
<body>
<div class="wrap">
	<div class="banner" id="banner" role="alert" hidden>
		<div><b id="bn-t">Done</b><p id="bn-m"></p></div>
		<button type="button" class="btn" id="bn-ok">Got it</button>
	</div>

	<header class="box">
		<p class="mono" style="margin:0">User and the Product &middot; run progress</p>
		<h1 id="title">Waiting for a run&hellip;</h1>
		<div class="pills">
			<span class="pill" id="state">loading</span>
			<span class="pill offline" id="offline" hidden>status.json unreachable</span>
			<button type="button" class="alarm" id="sound" aria-pressed="false"><svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/><path d="M3 3l18 18"/></svg><svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span id="sound-label">Alarm off &middot; click to turn on</span></button>
			<button type="button" class="test" id="test">Test</button>
		</div>
		<p class="note" id="note"></p>
		<div class="meta">
			<div><span class="mono">Started</span><b id="started">&ndash;</b></div>
			<div><span class="mono">Updated</span><b id="updated">&ndash;</b></div>
			<div><span class="mono">Run</span><b id="runid">&ndash;</b></div>
		</div>
	</header>

	<section class="box" aria-labelledby="ov-h">
		<h2 id="ov-h">Overall</h2>
		<div class="overall">
			<div class="bar" id="bar" role="progressbar" aria-label="Steps done" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar-fill"></i></div>
			<span class="count"><span id="pct">0%</span> <small id="frac">0 / 0</small></span>
		</div>
	</section>

	<section class="box" aria-labelledby="steps-h">
		<h2 id="steps-h">Steps</h2>
		<ol class="steps" id="steps"></ol>
		<p class="empty" id="empty">No steps yet.</p>
	</section>

	<p class="mono">Reads status.json every 10 seconds &middot; <span id="checked"></span></p>
</div>

<script>
(function () {
	'use strict';
	var SRC = 'status.json';
	var EVERY = 10000;
	var KEY = 'uap-progress-sound';
	var lastState = null;
	var soundOn = false;
	var ctx = null;
	var baseTitle = document.title;
	var flashTimer = null;

	function $(id) { return document.getElementById(id); }
	function el(tag, cls, text) {
		var n = document.createElement(tag);
		if (cls) { n.className = cls; }
		if (text !== undefined && text !== null && text !== '') { n.textContent = String(text); }
		return n;
	}
	function fmtTime(s) {
		if (!s) { return '–'; }
		var d = new Date(s);
		if (isNaN(d.getTime())) { return String(s); }
		return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
	}

	/* sound preference */
	try { soundOn = window.localStorage.getItem(KEY) === '1'; } catch (e) { soundOn = false; }
	function paintSound() {
		var b = $('sound');
		b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
		$('sound-label').textContent = soundOn ? 'Alarm on · will chime when done' : 'Alarm off · click to turn on';
	}
	function audio() {
		try {
			if (!ctx) {
				var A = window.AudioContext || window.webkitAudioContext;
				if (!A) { return null; }
				ctx = new A();
			}
			if (ctx.state === 'suspended') { ctx.resume(); }
		} catch (e) { return null; }
		return ctx;
	}
	function tone(freqs, gap, len, force) {
		if (!soundOn && !force) { return; }
		var c = audio();
		if (!c) { return; }
		var t0 = c.currentTime + 0.05;
		freqs.forEach(function (f, i) {
			var o = c.createOscillator();
			var g = c.createGain();
			var t = t0 + i * gap;
			o.type = 'sine';
			o.frequency.value = f;
			g.gain.setValueAtTime(0.0001, t);
			g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
			g.gain.exponentialRampToValueAtTime(0.0001, t + len);
			o.connect(g); g.connect(c.destination);
			o.start(t); o.stop(t + len + 0.05);
		});
	}
	function chime() { tone([659.25, 783.99, 1046.5], 0.18, 0.6); }
	function lowTone() { tone([311.13, 233.08], 0.32, 0.7); }
	$('sound').addEventListener('click', function () {
		soundOn = !soundOn;
		try { window.localStorage.setItem(KEY, soundOn ? '1' : '0'); } catch (e) { /* storage blocked */ }
		paintSound();
		if (soundOn) { tone([880], 0, 0.15); }
	});
	$('test').addEventListener('click', function () { tone([659.25, 783.99, 1046.5], 0.18, 0.6, true); });
	paintSound();

	/* finish signals */
	function stopFlash() {
		if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
	}
	function flashTitle(msg) {
		stopFlash();
		var on = false, n = 0;
		flashTimer = setInterval(function () {
			on = !on; n++;
			document.title = on ? msg : baseTitle;
			if (n >= 20) { stopFlash(); document.title = msg; }
		}, 800);
	}
	function announce(state, data) {
		var failed = state === 'failed';
		$('banner').className = 'banner' + (failed ? ' failed' : '');
		$('bn-t').textContent = failed ? 'Run failed' : 'Done';
		$('bn-m').textContent = (data.title || 'The run') + (failed ? ' stopped with a failure.' : ' has finished.');
		$('banner').hidden = false;
		if (failed) { lowTone(); flashTitle('Failed · ' + baseTitle); }
		else { chime(); flashTitle('Done · ' + baseTitle); }
	}
	$('bn-ok').addEventListener('click', function () {
		$('banner').hidden = true;
		stopFlash();
		document.title = baseTitle;
	});

	/* render */
	function render(data) {
		var steps = Array.isArray(data.steps) ? data.steps : [];
		var state = String(data.state || 'running');
		var done = steps.filter(function (s) { return s && s.status === 'done'; }).length;
		var pct = steps.length ? Math.round(100 * done / steps.length) : 0;

		$('title').textContent = data.title || 'Untitled run';
		baseTitle = (data.title ? data.title + ' · ' : '') + 'Run progress';
		if (!flashTimer && $('banner').hidden) { document.title = baseTitle; }
		var sp = $('state');
		sp.className = 'pill ' + state.replace(/[^a-z-]/gi, '');
		sp.textContent = state;
		sp.hidden = false;
		$('note').textContent = data.note || '';
		$('started').textContent = fmtTime(data.started);
		$('updated').textContent = fmtTime(data.updated);
		$('runid').textContent = data.run_id || '–';

		$('bar-fill').style.width = pct + '%';
		$('bar').className = 'bar' + (steps.length && done === steps.length ? ' complete' : '');
		$('bar').setAttribute('aria-valuenow', String(pct));
		$('pct').textContent = pct + '%';
		$('frac').textContent = done + ' / ' + steps.length;

		var list = $('steps');
		list.textContent = '';
		steps.forEach(function (s) {
			if (!s) { return; }
			var st = String(s.status || 'pending').replace(/[^a-z-]/gi, '');
			var li = el('li', 'step ' + st);
			if (st === 'running') { li.setAttribute('aria-current', 'step'); }
			li.appendChild(el('span', 'n', s.n));
			var body = el('div');
			body.appendChild(el('div', 't', s.title || ''));
			if (s.note) { body.appendChild(el('p', 'sn', s.note)); }
			li.appendChild(body);
			var side = el('div', 'side');
			side.appendChild(el('span', 'chip ' + st, st));
			if (s.time) { side.appendChild(el('span', 'time', s.time)); }
			li.appendChild(side);
			list.appendChild(li);
		});
		$('empty').hidden = steps.length > 0;

		if (lastState === 'running' && (state === 'finished' || state === 'failed')) { announce(state, data); }
		lastState = state;
	}

	function checked() { $('checked').textContent = 'last checked ' + new Date().toLocaleTimeString(); }
	function tick() {
		fetch(SRC, { cache: 'no-store' })
			.then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
			.then(function (data) {
				$('offline').hidden = true;
				render(data || {});
				checked();
			})
			.catch(function () {
				$('offline').hidden = false;
				if (lastState === null) { $('state').hidden = true; }
				checked();
			});
	}
	tick();
	setInterval(tick, EVERY);
})();
</script>
</body>
</html>
